<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #1976D2 0%, #0D47A1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 420px;
      height: 420px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- viewBox matches the Android vector: 108x108 -->
    <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Outer WiFi arc -->
      <path fill="#FFFFFF"
        d="M54,26C42.4,26 31.9,30.7 24.3,38.3L27.7,41.7C34.4,35 43.7,31 54,31C64.3,31 73.6,35 80.3,41.7L83.7,38.3C76.1,30.7 65.6,26 54,26Z"/>

      <!-- Middle WiFi arc -->
      <path fill="#FFFFFF"
        d="M54,38C45.5,38 37.8,41.5 32.1,47.2L35.5,50.6C40.3,45.8 46.8,43 54,43C61.2,43 67.7,45.8 72.5,50.6L75.9,47.2C70.2,41.5 62.5,38 54,38Z"/>

      <!-- Inner WiFi arc -->
      <path fill="#FFFFFF"
        d="M54,50C48.6,50 43.7,52.2 40.2,55.8L43.6,59.2C46.2,56.6 49.9,55 54,55C58.1,55 61.8,56.6 64.4,59.2L67.8,55.8C64.3,52.2 59.4,50 54,50Z"/>

      <!-- Center dot -->
      <path fill="#FFFFFF"
        d="M54,62A4.5,4.5 0,1 1,54,71A4.5,4.5 0,1 1,54,62Z"/>

      <!-- EKG line -->
      <path stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M19,80 L31,80 L35,73 L39,87 L43,69 L47,80 L51,74 L57,80 L61,76 L65,80 L89,80"/>

    </svg>
  </div>
</body>
</html>
